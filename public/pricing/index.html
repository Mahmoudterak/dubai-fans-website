<!doctype html>
<!-- Static redirect stub: /pricing was merged into /store#pricing.
     Served on static hosting where no server-side 301 is available;
     meta-refresh(0) + canonical tells crawlers the content moved. -->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0;url=/store#pricing" />
    <link rel="canonical" href="https://mtuaefans.com/store" />
    <meta name="robots" content="noindex" />
    <title>الأسعار انتقلت إلى المتجر | دبي فانز</title>
    <script>window.location.replace("/store#pricing");</script>
  </head>
  <body>
    <p>انتقلت صفحة الأسعار إلى <a href="/store#pricing">المتجر وباقات الأسعار</a>.</p>
  </body>
</html>
